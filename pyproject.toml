[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs55-evidence-chain-demo"
version = "0.1.0"
description = "Cross-modal storyboard-to-animatic-to-final evidence-chain demo using libevchain"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "torch>=2.1",
  "transformers>=4.40"
]

[tool.setuptools.packages.find]
where = ["src"]
